[Archive]
FileName=ax7z.spi
[Option]
;0:無効	1:有効
;書庫ファイルを短いファイル名で表示する、ツリーの誤動作が減るが名前のソートで位置がずれる
HookFindFirstFile=1
;多重起動を許す
HookCreateMutex=1
HookSetWindowText=1
; GDI text drawing hook for restoring lossy Unicode filenames.
; 1: enabled, 0: disabled. Set to 0 when display correction is not needed.
; If omitted, the default is 1.
HookTextDrawing=1

[InternalHook]
; Batch Leeyes file-list changes without discarding filesystem notifications.
; 1: enabled, 0: disabled. If omitted, the default is 1.
FileMoveBatch=1
; Queue size that switches from per-item updates to one normal full resync.
; Values below 2 are treated as 2. If omitted, the default is 32.
FileMoveBatchThreshold=32
; Confirm deletion-only updates against a watched local folder snapshot.
FileMoveDeleteBatch=1
; Batch file-only additions and sort once when the keys are safe.
FileMoveAddSortBatch=1

; Tree notification batching (folder tree). 0 = off, 1 = comparison only,
; 2 = state-based tree updates. Enabled by default; set 0 to use the original path.
FileMoveTreeBatchMode=2
; Quiet interval before one parent is reconciled. 50..5000 ms, otherwise 300.
FileMoveTreeBatchQuietMs=300
; Diagnostic log for tree batching. Keep 0 for normal use; 1 only to investigate.
FileMoveTreeBatchLog=0
