[Archive]
FileName=ax7z.spi
[Option]
;0:無効	1:有効
;書庫ファイルを短いファイル名で表示する、ツリーの誤動作が減るが名前のソートで位置がずれる
HookFindFirstFile=1
;多重起動を許す
HookCreateMutex=1
HookSetWindowText=1
; GDI text drawing hook for restoring lossy Unicode filenames.
; 1: enabled, 0: disabled. Set to 0 when display correction is not needed.
; If omitted, the default is 1.
HookTextDrawing=1

[InternalHook]
; Batch Leeyes file-list changes without discarding filesystem notifications.
; 1: enabled, 0: disabled. If omitted, the default is 1.
FileMoveBatch=1
; Queue size that switches from per-item updates to one normal full resync.
; Values below 2 are treated as 2. If omitted, the default is 32.
FileMoveBatchThreshold=32
